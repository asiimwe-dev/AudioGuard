version: "3.9"

services:
  api:
    build:
      context: .
      target: runtime
    ports:
      - "8000:8000"
    environment:
      - AUDIOGUARD_STORAGE_DIR=/data/storage
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
      - REDIS_URL=redis://redis:6379/0
      - PORT=8000
    volumes:
      - audioguard_data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Celery worker for heavy async jobs (>10 MB files)
  worker:
    build:
      context: .
      target: runtime
    command: >
      celery -A tasks worker
      --loglevel=info
      --concurrency=2
      --queues=encode,decode,default
    environment:
      - AUDIOGUARD_STORAGE_DIR=/data/storage
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - audioguard_data:/data
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  audioguard_data:
  redis_data:
